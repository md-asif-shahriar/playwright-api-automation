name: E2E Tests (Automation Project)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    name: Run Playwright E2E Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation-project
        uses: actions/checkout@v4
        with:
          repository: md-asif-shahriar/rokomari-automation-nextgen   # replace with real org/repo
          ref: main                                     # branch of automation-project to use
          token: ${{ secrets.AUTOMATION_REPO_PAT }}
          path: automation-project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: automation-project/package-lock.json

      - name: Install dependencies
        working-directory: automation-project
        run: npm ci

      - name: Install Playwright browsers
        working-directory: automation-project
        run: npx playwright install --with-deps

      # If your e2e tests need main-project running (e.g. localhost:3000),
      # start it here BEFORE this step, or point BASE_URL to a staging/preview URL.
      - name: Run Playwright tests
        working-directory: automation-project
        env:
          BASE_URL: https://md-asif-shahriar.github.io/playwright-api-automation/   # or hardcode a staging URL
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation-project/playwright-report/
          retention-days: 7